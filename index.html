<!DOCTYPE html>
<html>

<head>
    <title>Personalized Experience</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .section {
            display: none;
        }
    </style>
</head>

<body>

    <h1 id="greeting">Welcome</h1>

    <div id="electronics" class="section">
        <h2>CRM Solutions for You</h2>
        <p>Boost your sales with automation tools.</p>
    </div>

    <div id="clothes" class="section">
        <h2>Latest Fashion Collection</h2>
        <p>Discover trending styles.</p>
    </div>

    <div id="default" class="section">
        <h2>Explore Our Services</h2>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const interest = params.get("interest");
        const name = params.get("name");

        // Personal greeting
        if (name) {
            document.getElementById("greeting").innerText = "Hi " + name;
        }

        // Show content
        if (interest === "Electronics") {
            document.getElementById("electronics").style.display = "block";
        }
        else if (interest === "Clothes") {
            document.getElementById("clothes").style.display = "block";
        }
        else {
            document.getElementById("default").style.display = "block";
        }
    </script>

</body>

</html>
