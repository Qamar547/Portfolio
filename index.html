<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Eventify | Modern Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            margin: 0;
            position: relative;
        }

        /* subtle animated background grain */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 860px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .container:hover {
            box-shadow: 0 30px 55px -15px rgba(0, 0, 0, 0.3);
        }

        /* header decoration */
        .form-header {
            background: linear-gradient(98deg, #1a2a3f 0%, #0f1a2b 100%);
            padding: 1.6rem 2rem;
            position: relative;
            text-align: center;
        }

        .form-header h3 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(to right, #ffffff, #e0e7ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .form-header h3 i {
            background: none;
            color: #ffd966;
            font-size: 1.9rem;
            background-clip: unset;
            -webkit-background-clip: unset;
            color: #fbbf24;
        }

        .event-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #e2e8f0;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        /* main content */
        .form-content {
            padding: 2rem 2rem 2.2rem;
        }

        /* custom styling for the dynamics form wrapper */
        .dynamics-form-wrapper {
            width: 100%;
        }

        /* override default iframe / loader styles to make it blend */
        .dynamics-form-wrapper [data-form-id] {
            width: 100%;
        }

        /* style form elements globally — the loader injects modern fields */
        .dynamics-form-wrapper form,
        .dynamics-form-wrapper .form-loader {
            font-family: 'Inter', sans-serif;
        }

        /* make all input fields, selects, textareas look modern */
        .dynamics-form-wrapper input:not([type="checkbox"]):not([type="radio"]),
        .dynamics-form-wrapper select,
        .dynamics-form-wrapper textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            background-color: #fff;
            outline: none;
            margin-top: 0.25rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .dynamics-form-wrapper input:focus,
        .dynamics-form-wrapper select:focus,
        .dynamics-form-wrapper textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        /* labels */
        .dynamics-form-wrapper label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 0.25rem;
            letter-spacing: -0.2px;
        }

        /* custom submit button */
        .dynamics-form-wrapper button[type="submit"],
        .dynamics-form-wrapper input[type="submit"] {
            background: linear-gradient(105deg, #1e3a5f, #0f2b44);
            border: none;
            padding: 0.9rem 1.6rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            margin-top: 1rem;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 18px rgba(0, 35, 70, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dynamics-form-wrapper button[type="submit"]:hover,
        .dynamics-form-wrapper input[type="submit"]:hover {
            background: linear-gradient(105deg, #0f2b44, #081c2f);
            transform: translateY(-2px);
            box-shadow: 0 14px 26px -8px rgba(0, 35, 70, 0.4);
        }

        /* style checkbox / radio groups */
        .dynamics-form-wrapper input[type="checkbox"],
        .dynamics-form-wrapper input[type="radio"] {
            accent-color: #1e3a5f;
            width: 1.1rem;
            height: 1.1rem;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .dynamics-form-wrapper .checkbox-group,
        .dynamics-form-wrapper .radio-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0 1rem;
        }

        /* error & success message styling */
        .dynamics-form-wrapper .error-message,
        .dynamics-form-wrapper .validation-error {
            color: #e53e3e;
            font-size: 0.75rem;
            margin-top: -0.5rem;
            margin-bottom: 0.75rem;
            display: block;
        }

        /* custom card for loader fallback */
        .custom-loader-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #f8fafc;
            border-radius: 1.5rem;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1e3a5f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* additional responsive touches */
        @media (max-width: 640px) {
            .form-content {
                padding: 1.5rem;
            }

            .form-header h3 {
                font-size: 1.5rem;
            }

            .form-header h3 i {
                font-size: 1.6rem;
            }
        }

        /* style the date picker, dropdowns to match */
        .dynamics-form-wrapper input[type="date"] {
            font-family: 'Inter', sans-serif;
            padding: 0.8rem 1rem;
        }

        /* improve fieldset and legend if any */
        .dynamics-form-wrapper fieldset {
            border: none;
            margin: 0;
            padding: 0;
        }

        /* custom card style for thank you message if appears */
        .dynamics-form-wrapper .submission-success {
            background: #e6f7ec;
            border-left: 5px solid #2b9348;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            color: #1e4620;
        }

        /* make sure layout is consistent */
        .dynamics-form-wrapper .form-field {
            margin-bottom: 1rem;
        }

        /* add a little gradient border accent */
        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #3b82f6, #8b5cf6);
            border-radius: 2rem 2rem 0 0;
        }

        /* floating icons for fields idea — optional but enhances elegance */
        .dynamics-form-wrapper .field-wrapper {
            position: relative;
        }

        /* custom section for event details below header but above form */
        .event-highlight {
            background: #f1f5f9;
            border-radius: 1.2rem;
            padding: 1rem 1.4rem;
            margin-bottom: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border: 1px solid #e2edf7;
        }

        .event-info-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f3a5f;
        }

        .event-info-item i {
            font-size: 1.1rem;
            color: #3b82f6;
        }

        hr {
            margin: 0.5rem 0 1.2rem;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #e0e7ff, transparent);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-header">
            <h3>
                <i class="fas fa-calendar-alt"></i>
                elevate <span style="font-weight: 500;">|</span> experience
            </h3>
            <div class="event-badge">
                <i class="fas fa-map-marker-alt" style="font-size: 0.7rem;"></i> Innovation Hub · 12 May 2025
            </div>
        </div>
        <div class="form-content">
            <!-- event teaser / stylish details -->
            <div class="event-highlight">
                <div class="event-info-item"><i class="fas fa-microphone-alt"></i> Keynotes · Panels · Networking</div>
                <div class="event-info-item"><i class="fas fa-clock"></i> 09:00 – 18:00 (CET)</div>
                <div class="event-info-item"><i class="fas fa-ticket-alt"></i> Limited seats — secure yours</div>
            </div>

            <!-- Microsoft Dynamics Marketing Form Loader (original embed but fully stylish) -->
            <div class="dynamics-form-wrapper" id="dynamicFormContainer">
                <div data-form-id='430d2062-5f0d-f111-8407-000d3ab38362'
                    data-form-api-url='https://public-eur.mkt.dynamics.com/api/v1.0/orgs/377f7dd7-e701-f111-8c79-002248a15041/landingpageforms'
                    data-cached-form-url='https://assets-eur.mkt.dynamics.com/377f7dd7-e701-f111-8c79-002248a15041/digitalassets/forms/430d2062-5f0d-f111-8407-000d3ab38362'>
                </div>
            </div>

            <!-- small footnote with design touch -->
            <hr>
            <div
                style="display: flex; justify-content: flex-end; font-size: 0.7rem; color: #4b5563; gap: 12px; margin-top: 10px;">
                <span><i class="fas fa-lock"></i> Secure registration</span>
                <span><i class="fas fa-shield-alt"></i> GDPR compliant</span>
            </div>
        </div>
    </div>

    <!-- Dynamics Form Loader Script -->
    <script src='https://cxppusa1formui01cdnsa01-endpoint.azureedge.net/eur/FormLoader/FormLoader.bundle.js'></script>

    <!-- Additional script to inject custom styles into the dynamically loaded form elements
     and improve UX: wait for loader to mount then apply advanced styling hooks. 
     Also adds placeholders and accessibility improvements. -->
    <script>
        (function () {
            // Wait for the DOM to be fully loaded and also watch for dynamic insertion of form fields
            function enhanceFormStyles() {
                // Target the wrapper that contains the generated form
                const formContainer = document.querySelector('.dynamics-form-wrapper');
                if (!formContainer) return;

                // Function to apply polished overrides to all input groups
                const applyStyleEnhancements = () => {
                    // find all labels, add subtle icon enhancement? but keep clean
                    const labels = formContainer.querySelectorAll('label');
                    labels.forEach(label => {
                        // if label text exists and doesn't have a specific class, we ensure proper spacing
                        if (!label.classList.contains('styled-label')) {
                            label.style.fontWeight = '600';
                            label.style.fontSize = '0.85rem';
                            label.style.marginBottom = '0.3rem';
                            label.style.display = 'block';
                            label.style.color = '#0f2b3f';
                            label.classList.add('styled-label');
                        }
                    });

                    // Style all input fields (text, email, tel, etc)
                    const inputs = formContainer.querySelectorAll('input:not([type="submit"]):not([type="checkbox"]):not([type="radio"]), select, textarea');
                    inputs.forEach(field => {
                        if (!field.classList.contains('styled-field')) {
                            field.style.width = '100%';
                            field.style.padding = '0.85rem 1rem';
                            field.style.border = '1.5px solid #e2edf2';
                            field.style.borderRadius = '1rem';
                            field.style.fontFamily = "'Inter', sans-serif";
                            field.style.fontSize = '0.95rem';
                            field.style.transition = 'all 0.2s';
                            field.style.backgroundColor = '#ffffff';
                            field.style.marginTop = '0.25rem';
                            field.style.marginBottom = '0.9rem';
                            field.classList.add('styled-field');

                            // add focus event listener for glow
                            field.addEventListener('focus', function (e) {
                                this.style.borderColor = '#3b82f6';
                                this.style.boxShadow = '0 0 0 3px rgba(59,130,246,0.2)';
                            });
                            field.addEventListener('blur', function (e) {
                                this.style.borderColor = '#e2edf2';
                                this.style.boxShadow = 'none';
                            });

                            // optional: add placeholder styling if missing
                            if (field.getAttribute('placeholder') && field.getAttribute('placeholder').trim() === '') {
                                // keep as is
                            } else if (!field.getAttribute('placeholder') && (field.type === 'text' || field.type === 'email' || field.type === 'tel')) {
                                // optionally add placeholder hint but avoid overriding important ones
                            }
                        }
                    });

                    // Style checkboxes and radio groups to be modern and spaced
                    const checkRadio = formContainer.querySelectorAll('input[type="checkbox"], input[type="radio"]');
                    checkRadio.forEach(el => {
                        if (!el.classList.contains('styled-radio')) {
                            el.style.accentColor = '#1e3a5f';
                            el.style.width = '1.1rem';
                            el.style.height = '1.1rem';
                            el.style.marginRight = '0.5rem';
                            el.style.verticalAlign = 'middle';
                            el.classList.add('styled-radio');
                        }
                    });

                    // Style submit button (in case it's not styled yet)
                    const submitBtns = formContainer.querySelectorAll('button[type="submit"], input[type="submit"]');
                    submitBtns.forEach(btn => {
                        if (!btn.classList.contains('stylish-submit')) {
                            btn.style.background = 'linear-gradient(105deg, #1e3a5f, #0f2b44)';
                            btn.style.border = 'none';
                            btn.style.padding = '0.9rem 1.6rem';
                            btn.style.fontSize = '1rem';
                            btn.style.fontWeight = '600';
                            btn.style.borderRadius = '2rem';
                            btn.style.color = 'white';
                            btn.style.cursor = 'pointer';
                            btn.style.width = '100%';
                            btn.style.marginTop = '0.75rem';
                            btn.style.fontFamily = "'Inter', sans-serif";
                            btn.style.display = 'flex';
                            btn.style.alignItems = 'center';
                            btn.style.justifyContent = 'center';
                            btn.style.gap = '8px';
                            btn.style.transition = 'all 0.2s';
                            btn.style.boxShadow = '0 8px 18px rgba(0, 35, 70, 0.2)';

                            // Add icon if not present
                            if (!btn.querySelector('i')) {
                                const iconSpan = document.createElement('i');
                                iconSpan.className = 'fas fa-arrow-right';
                                iconSpan.style.fontSize = '0.9rem';
                                btn.appendChild(iconSpan);
                            }

                            btn.addEventListener('mouseenter', () => {
                                btn.style.transform = 'translateY(-2px)';
                                btn.style.boxShadow = '0 14px 26px -8px rgba(0, 35, 70, 0.4)';
                            });
                            btn.addEventListener('mouseleave', () => {
                                btn.style.transform = 'translateY(0)';
                                btn.style.boxShadow = '0 8px 18px rgba(0, 35, 70, 0.2)';
                            });
                            btn.classList.add('stylish-submit');
                        }
                    });

                    // Wrap field groups to improve spacing (optional grouping)
                    const formGroups = formContainer.querySelectorAll('.form-group, .field-group, div[class*="field"]');
                    if (formGroups.length === 0) {
                        // try to improve container spacing for each input parent
                        const allFields = formContainer.querySelectorAll('input:not([type="submit"]), select, textarea');
                        allFields.forEach(field => {
                            let parent = field.closest('div');
                            if (parent && !parent.classList.contains('enhanced-parent')) {
                                parent.style.marginBottom = '0.4rem';
                                parent.classList.add('enhanced-parent');
                            }
                        });
                    }

                    // if any error message appears, style nicely
                    const errors = formContainer.querySelectorAll('.error-message, .validation-error, .field-validation-error');
                    errors.forEach(err => {
                        err.style.color = '#e53e3e';
                        err.style.fontSize = '0.75rem';
                        err.style.marginTop = '-0.6rem';
                        err.style.marginBottom = '0.7rem';
                        err.style.display = 'block';
                    });

                    // success message area
                    const successDiv = formContainer.querySelector('.submission-success, .form-success');
                    if (successDiv) {
                        successDiv.style.background = '#e0f2e9';
                        successDiv.style.borderRadius = '1rem';
                        successDiv.style.padding = '0.9rem';
                        successDiv.style.marginBottom = '1rem';
                        successDiv.style.borderLeft = '4px solid #2b9348';
                    }
                };

                // initial application after a short delay to allow loader to inject elements
                setTimeout(applyStyleEnhancements, 300);

                // Use MutationObserver to watch for dynamic addition of form fields (the loader injects async)
                const observer = new MutationObserver((mutations) => {
                    let shouldRefresh = false;
                    for (let mutation of mutations) {
                        if (mutation.type === 'childList' && mutation.addedNodes.length) {
                            shouldRefresh = true;
                            break;
                        }
                    }
                    if (shouldRefresh) {
                        applyStyleEnhancements();
                    }
                });

                observer.observe(formContainer, { childList: true, subtree: true });

                // also apply on window load to be safe
                window.addEventListener('load', () => {
                    setTimeout(applyStyleEnhancements, 400);
                });
            }

            // run enhancement after script loads, also after potential reflows
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', enhanceFormStyles);
            } else {
                enhanceFormStyles();
            }

            // additionally catch if the FormLoader script completes rendering, we re-run styles periodically for 2 seconds
            let styleInterval = setInterval(() => {
                const wrapper = document.querySelector('.dynamics-form-wrapper');
                if (wrapper && wrapper.querySelector('form, input, select')) {
                    // if form exists, run styles
                    const event = new CustomEvent('formLoaded');
                    window.dispatchEvent(event);
                    clearInterval(styleInterval);
                }
            }, 200);

            window.addEventListener('formLoaded', () => {
                setTimeout(() => {
                    const submitBtn = document.querySelector('.dynamics-form-wrapper button[type="submit"], .dynamics-form-wrapper input[type="submit"]');
                    if (submitBtn && !submitBtn.querySelector('i')) {
                        const iconSpan = document.createElement('i');
                        iconSpan.className = 'fas fa-arrow-right';
                        iconSpan.style.fontSize = '0.9rem';
                        submitBtn.appendChild(iconSpan);
                    }
                    const styleFn = () => {
                        const labels = document.querySelectorAll('.dynamics-form-wrapper label');
                        labels.forEach(l => l.style.fontWeight = '600');
                    };
                    styleFn();
                }, 100);
            });

            // Also listen for any clicks to re-apply if needed
            document.body.addEventListener('click', function () {
                setTimeout(() => {
                    const btns = document.querySelectorAll('.dynamics-form-wrapper button[type="submit"]');
                    btns.forEach(btn => {
                        if (!btn.style.background || btn.style.background !== 'linear-gradient(105deg, #1e3a5f, #0f2b44)') {
                            btn.style.background = 'linear-gradient(105deg, #1e3a5f, #0f2b44)';
                            btn.style.borderRadius = '2rem';
                            btn.style.fontWeight = '600';
                        }
                    });
                }, 50);
            });

        })();
    </script>

    <!-- Add extra style to make sure date picker and dynamic inputs are smooth -->
    <style>
        /* additional robust overrides */
        .dynamics-form-wrapper input,
        .dynamics-form-wrapper select,
        .dynamics-form-wrapper textarea {
            transition: all 0.2s ease-in-out;
        }

        .dynamics-form-wrapper input:hover,
        .dynamics-form-wrapper select:hover,
        .dynamics-form-wrapper textarea:hover {
            border-color: #b9d0f0;
        }

        /* improve background consistency */
        .dynamics-form-wrapper {
            background: transparent;
        }

        /* ensure that any recaptcha or custom container doesn't break */
        .dynamics-form-wrapper div[class*="recaptcha"] {
            margin: 1rem 0;
        }

        /* set global box-sizing */
        .dynamics-form-wrapper *,
        .container * {
            box-sizing: border-box;
        }

        /* custom focus style for buttons consistency */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #2c6e9e;
            outline-offset: 2px;
        }

        /* make sure container border radius on mobile */
        @media (max-width: 480px) {
            .container {
                border-radius: 1.5rem;
            }

            .form-content {
                padding: 1.2rem;
            }
        }

        /* little hover effect for event-highlight */
        .event-highlight {
            transition: all 0.2s;
        }

        .event-highlight:hover {
            background: #eef3fc;
            border-color: #cbdff2;
        }
    </style>

</body>

</html>
